<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Dark Cavern — Mini Action Platformer (Monochrome)</title>
<style>
  :root{
    --bg-ink:#050505;
    --dark-grey:#0f0f0f;
    --mid-grey:#2b2b2b;
    --stone:#555555;
    --light:#e9e9e9;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg-ink);
    color:var(--light);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    background:transparent;
    image-rendering: pixelated; /* give pixel-ish feel on scaling */
  }
  /* On-screen controls (transparent overlays) */
  .touch-btn{
    position:fixed;
    border-radius:999px;
    background:rgba(255,255,255,0.04);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
    touch-action: none;
    user-select: none;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--light);
    font-weight:700;
    font-size:18px;
  }
  #left-pad{
    left:16px;
    bottom:16px;
    width:120px;
    height:120px;
  }
  #right-pad{
    right:16px;
    bottom:72px;
    width:64px;
    height:64px;
  }
  #jump-btn{
    right:96px;
    bottom:16px;
    width:88px;
    height:88px;
  }
  #shoot-btn{
    right:16px;
    bottom:16px;
    width:88px;
    height:88px;
  }
  .semi-ghost { opacity:0.9; }
  /* Top UI */
  .ui-top{
    position:fixed;
    left:16px;
    right:16px;
    top:8px;
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
  }
  .ui-left, .ui-center, .ui-right{
    display:flex;
    gap:12px;
    align-items:center;
    pointer-events:auto;
  }
  .bar{
    height:12px;
    width:220px;
    background:rgba(255,255,255,0.06);
    border-radius:6px;
    overflow:hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,#ffffff,#bdbdbd);
    width:100%;
    transform-origin:left center;
    transition:width 150ms linear;
    box-shadow: 0 0 8px rgba(255,255,255,0.25);
  }
  .label{
    font-size:13px;
    color:var(--light);
    opacity:0.9;
    white-space:nowrap;
  }
  .small{
    font-size:12px;
    opacity:0.8;
  }
  /* Mobile prompt hidden on desktop sized screens */
  @media (min-width:900px){
    #left-pad, #right-pad, #jump-btn, #shoot-btn { opacity:0.6; }
  }
  /* Accessibility: focus outlines for keyboard users (if buttons ever focusable) */
  .touch-btn:focus { outline:2px solid rgba(255,255,255,0.12); }
  /* Tiny help at top-right */
  #help {
    position:fixed;
    right:12px;
    top:12px;
    color:rgba(255,255,255,0.6);
    font-size:12px;
    pointer-events:none;
    user-select:none;
  }
</style>
</head>
<body>
<div id="game" aria-hidden="false">
  <canvas id="canvas" width="1280" height="720"></canvas>
</div>

<!-- On-screen Touch Controls -->
<div id="left-pad" class="touch-btn" role="button" aria-label="Left and Right pad">
  <!-- we'll handle pointer positions; show arrows -->
  <div style="display:flex;width:100%;justify-content:space-between;padding:10px;">
    <div id="btn-left" style="width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;">◀</div>
    <div id="btn-right" style="width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;">▶</div>
  </div>
</div>

<div id="jump-btn" class="touch-btn" aria-label="Jump">▲</div>
<div id="shoot-btn" class="touch-btn" aria-label="Attack">●</div>

<!-- Invisible small pad for fine aiming or extra action (not used heavily) -->
<div id="right-pad" class="touch-btn" aria-hidden="true"></div>

<!-- Top UI (health bars, score) -->
<div class="ui-top">
  <div class="ui-left">
    <div class="label">Player</div>
    <div class="bar" title="Player Health"><div id="player-health" class="bar-fill" style="width:100%"></div></div>
    <div class="small" id="lives">Lives: 3</div>
  </div>
  <div class="ui-center" style="justify-content:center;flex:1;">
    <div class="label">Score: <span id="score">0</span></div>
  </div>
  <div class="ui-right" style="justify-content:flex-end;">
    <div class="label">Boss</div>
    <div class="bar" title="Boss Health" style="width:340px;"><div id="boss-health" class="bar-fill" style="width:100%"></div></div>
  </div>
</div>

<div id="help">Controls: ← → / A D, Space jump, Z/X attack — Tap buttons on mobile</div>

<script>
/*
  Dark Cavern — Single-file HTML5 Canvas action-platformer
  - Monochrome visuals (black/greys/white)
  - Player: move, jump, shoot light beams
  - Enemies including a Boss with health bar and attack pattern
  - Touch controls + keyboard
  - All drawing uses Canvas API (no external assets)
*/

/* ======= Initialization & Utilities ======= */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha: false });

let DPR = Math.max(1, window.devicePixelRatio || 1);

function resizeCanvas(){
  const w = Math.max(window.innerWidth, 480);
  const h = Math.max(window.innerHeight, 360);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.floor(w * DPR);
  canvas.height = Math.floor(h * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0); // scale drawing for DPR
}
window.addEventListener('resize', () => { resizeCanvas(); });
resizeCanvas();

/* Simple helpers */
const rand = (a,b)=> a + Math.random()*(b-a);
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));
const dist = (ax,ay,bx,by)=> Math.hypot(ax-bx,ay-by);

/* ======= Game State ======= */

const state = {
  running: true,
  score: 0,
  lives: 3,
  time: 0,
  lastTime: performance.now(),
  keys: {},
  pointers: {}, // for touch control tracking
};

/* ======= World & Visuals ======= */

const world = {
  gravity: 2000, // px / s^2
  groundY: null, // set on resize
  platforms: [], // minimal platforms
  caveShapes: [], // for background stalactites/pillars
}
function initWorld(){
  const H = canvas.clientHeight;
  world.groundY = H - 84;
  // create simple platforms (x, y, w, h)
  world.platforms = [
    {x:0, y:world.groundY, w:canvas.clientWidth, h:120, solid:true},
    {x:240, y:world.groundY-140, w:240, h:22, solid:true},
    {x:720, y:world.groundY-220, w:280, h:22, solid:true},
  ];
  // cave shapes (for atmosphere) - array of triangles/rects
  world.caveShapes = [];
  const W = canvas.clientWidth;
  for(let i=0;i<12;i++){
    const baseX = rand(-50, W + 50);
    const baseY = rand(40, world.groundY - 40);
    const width = rand(40, 220);
    const height = rand(40, 220);
    world.caveShapes.push({x:baseX,y:baseY,w:width,h:height,shade: rand(0.06,0.3)});
  }
}
initWorld();

/* ======= Player ======= */

const player = {
  x:140,
  y:0,
  w:28,
  h:42,
  vx:0,
  vy:0,
  dir:1, // 1 right, -1 left
  onGround:false,
  maxSpeed:260,
  accel:2500,
  jumpForce:740,
  health:100,
  maxHealth:100,
  shootCooldown:0,
  lives:3
};
player.y = world.groundY - player.h - 1;

/* ======= Projectiles ======= */

class Projectile {
  constructor(x,y,vx,vy,owner='player',life=1.6){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.owner=owner; this.life=life; this.r=6; this.age=0;
  }
  update(dt){
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.age += dt;
    return this.age < this.life;
  }
  draw(ctx){
    // bright beam look: draw a softened stroke + core
    ctx.save();
    ctx.translate(this.x, this.y);
    const speed = Math.hypot(this.vx, this.vy) + 0.1;
    const ang = Math.atan2(this.vy, this.vx);
    ctx.rotate(ang);
    // tail glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(240,240,240,0.07)';
    ctx.beginPath(); ctx.ellipse( -speed*8, 0, 18, 6, 0, 0, Math.PI*2 ); ctx.fill();
    // main luminous streak
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff';
    ctx.fillRect(-4, -2, speed*14, 4);
    // core
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, -1.6, Math.max(6, speed*10), 3.2);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
  }
}

/* ======= Enemies & Boss ======= */

class Enemy {
  constructor(x,y,type='grunt'){
    this.x=x; this.y=y; this.w=36; this.h=36;
    this.vx=rand(-40,40);
    this.vy=0;
    this.type=type;
    this.health = (type==='boss')?300:30;
    this.maxHealth = this.health;
    this.shotTimer = rand(0.6,1.8);
    this.alive = true;
    this.attackCooldown = 0;
    this.phase = 0;
  }
  update(dt){
    // simple AI: patrol / chase a bit / boss complex
    if(this.type === 'grunt'){
      // walk, bounce at edges
      this.vx += (Math.random()-0.5)*60*dt;
      if(Math.abs(this.vx) < 20) this.vx += (Math.random()>0.5?1:-1)*20;
      this.x += this.vx*dt;
      this.shotTimer -= dt;
      if(this.shotTimer <= 0){
        this.shotTimer = rand(1.2,2.6);
        // shoot towards player
        spawnEnemyShot(this, player.x + player.w/2, player.y + player.h/2);
      }
      // small gravity
      this.vy += world.gravity * 0.5 * dt;
      this.y += this.vy * dt;
      // ground collision
      if(this.y + this.h > world.groundY){
        this.y = world.groundY - this.h;
        this.vy = 0;
      }
    } else if(this.type === 'boss'){
      // Boss has phases: slow move + targeted shots + dash
      this.phase += dt;
      // move to roughly above player sometimes
      const targetX = player.x + 80 * Math.sin(state.time * 0.6);
      const dx = targetX - this.x;
      this.vx = clamp(dx * 0.8, -160, 160);
      this.x += this.vx * dt;
      // vertical float
      this.y = world.groundY - 260 + Math.sin(state.time*0.9)*14;
      // shooting pattern
      this.attackCooldown -= dt;
      if(this.attackCooldown <= 0){
        this.attackCooldown = rand(0.6,1.0);
        // burst of shots towards player
        for(let i=0;i<3;i++){
          setTimeout(()=> spawnEnemyShot(this, player.x + player.w/2 + rand(-30,30), player.y+player.h/2 + rand(-20,20)), i*140);
        }
      }
      // big dash occasionally
      if(Math.random() < dt*0.02){
        // dash across
        const dir = (Math.random()>0.5)?1:-1;
        const dashV = 900 * dir;
        this.x += dashV * 0.12;
      }
    }
    // check death
    if(this.health <= 0){
      this.alive = false;
      spawnParticles(this.x + this.w/2, this.y + this.h/2, 18, '#fff');
    }
  }
  draw(ctx){
    // draw boss larger, grungy geometric sprite
    ctx.save();
    ctx.translate(this.x, this.y);
    if(this.type === 'grunt'){
      // body rectangle + eye
      ctx.fillStyle = '#222';
      ctx.fillRect(0,0,this.w,this.h);
      // subtle highlight geometry
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.fillRect(4,4,this.w-8,this.h/3);
      // eye/pupil (white glow)
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(this.w/2, this.h/2 - 4, 4, 6, 0,0,Math.PI*2); ctx.fill();
    } else {
      // Boss big silhouette geometric
      const bw = 140, bh = 140;
      const ox = -bw/2 + this.w/2;
      const oy = -bh + 32;
      // mørk body
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.moveTo(ox, oy+bh);
      ctx.lineTo(ox + bw*0.15, oy + bh*0.2);
      ctx.lineTo(ox + bw*0.5, oy);
      ctx.lineTo(ox + bw*0.85, oy + bh*0.2);
      ctx.lineTo(ox + bw, oy+bh);
      ctx.closePath();
      ctx.fill();
      // layered plates
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      for(let i=0;i<5;i++){
        ctx.fillRect(ox + i*8, oy + 20 + i*18, bw - i*16, 12);
      }
      // glowing core
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 28;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(ox + bw/2, oy + bh/2 - 8, 14, 10, 0,0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }
}

const enemies = [];
let boss = null;

/* Particles for hit effects */
const particles = [];
function spawnParticles(x,y,count,color='#fff'){
  for(let i=0;i<count;i++){
    particles.push({
      x:x + rand(-6,6),
      y:y + rand(-6,6),
      vx:rand(-220,220),
      vy:rand(-320,80),
      life:rand(0.3,0.9),
      age:0,
      color:color,
      r:rand(1,3)
    });
  }
}

/* Projectiles lists */
const projectiles = [];

/* Spawn enemy shot utility */
function spawnEnemyShot(enemy, targetX, targetY){
  const sx = enemy.x + (enemy.w/2);
  const sy = enemy.y + (enemy.h/2);
  const dx = targetX - sx, dy = targetY - sy;
  const len = Math.hypot(dx,dy) || 1;
  const speed = (enemy.type==='boss')? 420 : 240;
  const vx = dx/len * speed;
  const vy = dy/len * speed;
  projectiles.push(new Projectile(sx, sy, vx, vy, 'enemy', 2.2));
  // flash particles
  spawnParticles(sx,sy,6,'#fff');
}

/* ======= Input Handling (Keyboard + Touch) ======= */

const keys = state.keys;
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

/* Touch controls: map to same input states */
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');
const jumpBtn = document.getElementById('jump-btn');
const shootBtn = document.getElementById('shoot-btn');

const touchMap = {
  left:false, right:false, jump:false, shoot:false
};

function pointerDownHandler(e, name){
  e.preventDefault();
  touchMap[name] = true;
}
function pointerUpHandler(e, name){
  e.preventDefault();
  touchMap[name] = false;
}
btnLeft.addEventListener('pointerdown', e => pointerDownHandler(e,'left'));
btnLeft.addEventListener('pointerup', e => pointerUpHandler(e,'left'));
btnLeft.addEventListener('pointercancel', e => pointerUpHandler(e,'left'));
btnLeft.addEventListener('pointerout', e => pointerUpHandler(e,'left'));
btnRight.addEventListener('pointerdown', e => pointerDownHandler(e,'right'));
btnRight.addEventListener('pointerup', e => pointerUpHandler(e,'right'));
btnRight.addEventListener('pointercancel', e => pointerUpHandler(e,'right'));
btnRight.addEventListener('pointerout', e => pointerUpHandler(e,'right'));
jumpBtn.addEventListener('pointerdown', e => pointerDownHandler(e,'jump'));
jumpBtn.addEventListener('pointerup', e => pointerUpHandler(e,'jump'));
jumpBtn.addEventListener('pointercancel', e => pointerUpHandler(e,'jump'));
shootBtn.addEventListener('pointerdown', e => pointerDownHandler(e,'shoot'));
shootBtn.addEventListener('pointerup', e => pointerUpHandler(e,'shoot'));
shootBtn.addEventListener('pointercancel', e => pointerUpHandler(e,'shoot'));

/* Map keyboard + touch to action booleans */
function getInput(){
  return {
    left: keys['arrowleft'] || keys['a'] || touchMap.left,
    right: keys['arrowright'] || keys['d'] || touchMap.right,
    jump: keys[' '] || keys['spacebar'] || keys['space'] || touchMap.jump,
    shoot: keys['z'] || keys['x'] || keys['k'] || touchMap.shoot
  };
}

/* ======= Game Logic ======= */

function playerShoot(){
  const now = performance.now() / 1000;
  if(player.shootCooldown > 0) return;
  player.shootCooldown = 0.28;
  const px = player.x + player.w/2 + player.dir*12;
  const py = player.y + player.h/2 - 4;
  const speed = 640;
  const vx = player.dir * speed;
  const vy = 0;
  projectiles.push(new Projectile(px,py,vx,vy,'player',1.4));
  spawnParticles(px,py,6,'#fff');
}

function spawnGrunt(x,y){
  enemies.push(new Enemy(x,y,'grunt'));
}

/* Spawn boss */
function spawnBoss(){
  boss = new Enemy(canvas.clientWidth - 420, world.groundY - 140, 'boss');
  enemies.push(boss);
}

/* Simple collision AABB */
function aabbIntersect(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

/* Update step */
function update(dt){
  state.time += dt;
  // Input
  const inpt = getInput();

  // Player horizontal movement
  let move = 0;
  if(inpt.left) move -= 1;
  if(inpt.right) move += 1;
  if(move !== 0) player.dir = move > 0 ? 1 : -1;

  // accelerate toward target velocity
  const targetV = move * player.maxSpeed;
  const accel = player.accel;
  player.vx = player.vx + clamp(targetV - player.vx, -accel*dt, accel*dt);

  // Gravity
  player.vy += world.gravity * dt;

  // Jumping (press -> impulse)
  if(inpt.jump && player.onGround){
    player.vy = -player.jumpForce;
    player.onGround = false;
  }

  // Shooting
  if(inpt.shoot){
    playerShoot();
  }
  player.shootCooldown = Math.max(0, player.shootCooldown - dt);

  // Integrate position
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // Platform collisions (very simple)
  player.onGround = false;
  for(const p of world.platforms){
    if(aabbIntersect(player.x, player.y, player.w, player.h, p.x, p.y - p.h, p.w, p.h + 6) ||
       aabbIntersect(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)){
      // If falling and crossing top
      if(player.vy >= 0 && (player.y + player.h) - p.y < 24){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
  // clamp to world
  if(player.x < 4) player.x = 4;
  if(player.x + player.w > canvas.clientWidth - 4) player.x = canvas.clientWidth - 4 - player.w;
  if(player.y > canvas.clientHeight + 200){
    // fell off, lose life
    player.health = 0;
  }

  // Update projectiles
  for(let i = projectiles.length - 1; i >= 0; i--){
    const pr = projectiles[i];
    if(!pr.update(dt)) { projectiles.splice(i,1); continue; }
    // collisions
    if(pr.owner === 'player'){
      // hit enemies
      for(const e of enemies){
        if(!e.alive) continue;
        if(aabbIntersect(pr.x-6, pr.y-6, 12,12, e.x, e.y, e.w, e.h)){
          e.health -= 18;
          projectiles.splice(i,1);
          spawnParticles(pr.x,pr.y,8,'#fff');
          state.score += (e.type==='boss'? 12 : 3);
          break;
        }
      }
    } else {
      // enemy shot hits player
      if(aabbIntersect(pr.x-6, pr.y-6, 12,12, player.x, player.y, player.w, player.h)){
        player.health -= 12;
        spawnParticles(player.x + player.w/2, player.y + player.h/2, 12,'#fff');
        projectiles.splice(i,1);
      }
    }
  }

  // Update enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(!e.alive){
      enemies.splice(i,1);
      continue;
    }
    e.update(dt);
    // collision: enemy touches player
    if(aabbIntersect(player.x,player.y,player.w,player.h, e.x, e.y, e.w, e.h)){
      // take hit and push back
      player.health -= 8 * dt * 12; // small continuous damage
      // bounce player a bit
      player.x -= (player.x < e.x) ? 8 : -8;
    }
  }

  // particles
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += world.gravity * 0.8 * dt * 0.001;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.age += dt;
    if(p.age >= p.life) particles.splice(i,1);
  }

  // Boss spawn logic: if boss not present and score reaches threshold spawn boss
  if(!boss && state.score >= 18){
    spawnBoss();
  }

  // Player death / respawn
  if(player.health <= 0){
    state.lives -= 1;
    state.score = Math.max(0, state.score - 24);
    if(state.lives <= 0){
      // game over: reset
      resetGame();
      return;
    } else {
      // respawn near left
      state.score = Math.max(0, state.score);
      player.x = 120;
      player.y = world.groundY - player.h - 1;
      player.vx = player.vy = 0;
      player.health = player.maxHealth;
    }
  }
}

/* ======= Rendering ======= */

function drawBackground(ctx, w, h){
  // overall fill
  ctx.fillStyle = '#050506';
  ctx.fillRect(0,0,w,h);

  // subtle vertical vignette gradient
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0b0b0b');
  g.addColorStop(0.5,'#0b0b0b');
  g.addColorStop(1,'#020202');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,w,h);

  // draw cave shapes (large geometric silhouettes) with varying grey levels
  for(const s of world.caveShapes){
    ctx.fillStyle = `rgba(255,255,255,${s.shade*0.06})`;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y + s.h);
    ctx.lineTo(s.x + s.w*0.4, s.y + s.h*0.1);
    ctx.lineTo(s.x + s.w*0.6, s.y);
    ctx.lineTo(s.x + s.w, s.y + s.h);
    ctx.closePath();
    ctx.fill();
  }

  // stalactites at top - repeated triangles
  ctx.fillStyle = 'rgba(255,255,255,0.025)';
  for(let i=0;i<w;i+=48){
    const h0 = 22 + (i%96===0?40:0);
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i+18, h0);
    ctx.lineTo(i+36,0);
    ctx.closePath();
    ctx.fill();
  }

  // floor fog/glow (soft)
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(0, world.groundY-12, w, h - world.groundY + 12);
}

/* draw platform geometry */
function drawPlatforms(ctx){
  ctx.fillStyle = '#111';
  for(const p of world.platforms){
    ctx.fillRect(p.x, p.y - p.h, p.w, p.h);
    // stone edge highlight
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(p.x+6, p.y - p.h + 6, p.w - 12, 6);
    ctx.fillStyle = '#111';
  }
}

/* draw UI bars */
function updateUI(){
  // player health
  const ph = Math.max(0, player.health / player.maxHealth * 100);
  document.getElementById('player-health').style.width = ph + '%';
  document.getElementById('score').textContent = Math.floor(state.score);
  document.getElementById('lives').textContent = 'Lives: ' + state.lives;
  // boss health
  if(boss){
    const bh = Math.max(0, boss.health / boss.maxHealth * 100);
    document.getElementById('boss-health').style.width = bh + '%';
  } else {
    document.getElementById('boss-health').style.width = '0%';
  }
}

function render(){
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  // draw background & cave
  drawBackground(ctx, w, h);

  // draw platforms
  drawPlatforms(ctx);

  // depth ordering: particles behind player? We'll draw particles faintly then player then projectiles then enemies then foreground glow
  // Draw distant particles
  for(const p of particles){
    ctx.fillStyle = `rgba(255,255,255,${1 - (p.age/p.life)})`;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.r, p.r, 0,0,Math.PI*2);
    ctx.fill();
  }

  // draw player (pixel-geometric style)
  ctx.save();
  ctx.translate(player.x, player.y);
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(4, player.h - 6, player.w - 8, 6);
  // body
  ctx.fillStyle = '#202020';
  ctx.fillRect(0,0,player.w,player.h);
  // cloak / light source on hand
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(6,6,player.w-12,10);
  // hand-glow if shooting imminent
  if(player.shootCooldown < 0.18){
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.dir>0?player.w-10:-4, player.h/2-4, 10, 8);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
  }
  // eye (small)
  ctx.fillStyle = '#fff';
  ctx.fillRect(player.w/2 - 2, 10, 4, 6);
  ctx.restore();

  // draw projectiles (under enemies for visual layering)
  for(const pr of projectiles){
    pr.draw(ctx);
  }

  // draw enemies
  for(const e of enemies){
    e.draw(ctx);
  }

  // foreground cave geometry (sharp)
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  for(let i=0;i<w;i+=68){
    ctx.beginPath();
    ctx.moveTo(i+8, h);
    ctx.lineTo(i+28, world.groundY + 18);
    ctx.lineTo(i+48, h);
    ctx.closePath();
    ctx.fill();
  }

  // HUD target reticle for boss maybe
  if(boss){
    // small minimalistic cross where boss is focusing
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#bdbdbd';
    ctx.beginPath();
    ctx.arc(boss.x + boss.w/2, boss.y + boss.h/2, 28, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // optionally draw debug: player rect edges (omitted)
}

/* ======= Main Loop ======= */

function gameLoop(now){
  const t = now;
  const dt = Math.min(1/30, (t - state.lastTime) / 1000);
  state.lastTime = t;
  if(state.running){
    update(dt);
    render();
    updateUI();
  }
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

/* ======= Spawning & Game Flow ======= */

let enemySpawnAcc = 0;
setInterval(()=> {
  // spawn grunts periodically until boss appears
  if(!boss){
    const x = rand(420, canvas.clientWidth - 160);
    spawnGrunt(x, world.groundY - 36);
  }
}, 2200);

/* Reset function */
function resetGame(){
  // clear arrays, reset state
  enemies.length = 0;
  projectiles.length = 0;
  particles.length = 0;
  boss = null;
  state.score = 0;
  state.lives = 3;
  player.x = 120;
  player.y = world.groundY - player.h - 4;
  player.health = player.maxHealth;
}

/* initial small spawn */
for(let i=0;i<2;i++) spawnGrunt(rand(360,900), world.groundY - 36);

/* ensure world regenerates on resize */
window.addEventListener('resize', () => {
  initWorld();
  // reposition player if off-screen
  player.x = clamp(player.x, 4, canvas.clientWidth - player.w - 4);
});

/* ======= Touch: prevent scroll on canvas */
['touchstart','touchmove','touchend','touchcancel'].forEach(ev => {
  document.addEventListener(ev, e => {
    // if touches on control areas, prevent default to avoid page scroll
    // simple heuristic: if touch target is inside control elements
    for(const t of e.changedTouches){
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if(el && (el.closest('.touch-btn') || el === canvas)){
        e.preventDefault();
        break;
      }
    }
  }, {passive:false});
});

/* Lightweight instructions in console */
console.log("Dark Cavern ready. Keyboard: ← → / A D, Space jump, Z/X attack. Mobile: use on-screen controls.");

/* Done: game file ready */
</script>
